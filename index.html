<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Gira la Tierra, toca un país y mira cómo es, qué pasa ahí ahora y qué cuentan de él. Gratis, sin cuentas y sin anuncios.">
  <meta name="theme-color" content="#05070c">
  <meta property="og:title" content="Giramundo">
  <meta property="og:description" content="Gira la Tierra. Toca un país. Gratis, sin cuentas y sin anuncios.">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Giramundo</title>
</head>
<body>
  <div id="stage">
    <canvas id="c" aria-label="Globo terráqueo. Arrastra para girar. Toca un país para abrirlo. Con el teclado: flechas para girar, más y menos para acercar, Enter para el país del centro."></canvas>
    <canvas id="flat" hidden aria-label="Mapa del mundo. Arrastra para mover, rueda para acercar, toca un país para abrirlo."></canvas>
  </div>
  <div class="vignette" aria-hidden="true"></div>
  <div id="ui"></div>
  <p id="coach" class="coach">Gira el globo y toca un país</p>
  <div id="tip" class="tip" hidden></div>
  <p id="boot-error" class="boot" hidden></p>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
