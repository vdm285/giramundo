name: Pages

on:
  push:
    branches: [main]
  schedule:
    # Every 6 hours: refresh deploy-time data (news headlines) and redeploy.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Deploy-time data (public/data/news/, gitignored). A feed outage must never block a deploy.
      - run: npm run news
        continue-on-error: true
      # Video curation needs a YouTube Data API key (free quota). Without the
      # secret the script copies the committed seed. The cursor sweeps the
      # countries across daily runs, so cache it between runs.
      - uses: actions/cache@v4
        with:
          path: data/cache/youtube
          key: youtube-cursor-${{ github.run_id }}
          restore-keys: youtube-cursor-
      - run: npm run videos
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: npm run build
        env:
          VITE_BASE: /giramundo/
          # Optional: a Google Maps Embed API key restricted to this site's URL
          # (repository variable). Without it, Ver shows links instead of embeds.
          VITE_MAPS_EMBED_KEY: ${{ vars.VITE_MAPS_EMBED_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
